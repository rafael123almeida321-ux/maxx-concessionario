<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#111318">
  <link rel="canonical" href="https://grupomaxxsworkmultimarcas.com.br/contato.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Maxxs Work Multimarcas">
  <meta property="og:title" content="Contato e endereço · Maxxs Work Multimarcas">
  <meta property="og:description" content="Fale com a Maxxs Work Multimarcas: WhatsApp, telefone, Instagram e endereço da loja na Av. Marechal Tito, 1881 e 2323, São Miguel Paulista.">
  <meta property="og:image" content="https://grupomaxxsworkmultimarcas.com.br/assets/img/og.jpg">
  <meta property="og:url" content="https://grupomaxxsworkmultimarcas.com.br/contato.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/montserrat-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/site.css?v=4">
</head>
<body data-page="contato">
<main>
  <section class="page-hero">
    <div class="container">
      <nav class="crumbs" aria-label="Você está em"><a href="index.html">Início</a> / <span>Contato</span></nav>
      <h1 class="reveal">Vem pra <span class="gold-text">Maxxs Work</span></h1>
      <p class="lead reveal">Chama no WhatsApp, liga ou passa aqui na loja para um café. Vai ser um prazer te receber.</p>
    </div>
  </section>
  <section class="section" style="padding-top:50px">
    <div class="container">
      <div class="contact-cards">
        <a href="#" data-wa-geral class="reveal"><div class="ic" data-icon="wa"></div><small>WhatsApp</small><b data-cfg="whatsappExibicao"></b></a>
        <a href="#" data-cfg-tel class="reveal" style="--d:.06s"><div class="ic" data-icon="phone"></div><small>Telefone</small><b data-cfg="telefone"></b></a>
        <a href="#" data-cfg-ig target="_blank" rel="noopener" class="reveal" style="--d:.12s"><div class="ic" data-icon="ig"></div><small>Instagram</small><b>@<span data-cfg="instagram"></span></b></a>
        <a href="#" data-agendar class="reveal" style="--d:.18s"><div class="ic" data-icon="cal"></div><small>Agendar visita</small><b>Escolher dia e horário</b></a>
      </div>
      <div class="two-col" style="margin-top:40px">
        <div class="reveal">
          <div class="info-row"><span class="ic" data-icon="pin"></span><div><small>Endereço</small><b data-endereco></b></div></div>
          <div class="info-row" style="margin-top:14px"><span class="ic" data-icon="clock"></span><div><small>Horário</small><b data-horario></b></div></div>
          <div class="map"><iframe id="map" title="Mapa da loja" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
        </div>
        <form class="card-form reveal" id="ct-form" style="--d:.1s">
          <h3 style="margin-bottom:22px">Mande uma mensagem</h3>
          <div class="field"><label for="c1">Nome</label><input class="input" id="c1" name="nome" required autocomplete="name"></div>
          <div class="field"><label for="c2">WhatsApp</label><input class="input" id="c2" name="tel" required inputmode="tel" autocomplete="tel"></div>
          <div class="field"><label for="c3">Mensagem</label><textarea class="textarea" id="c3" name="msg" required placeholder="Como podemos ajudar?"></textarea></div>
          <button class="btn btn-gold btn-block" type="submit"><span data-icon="wa"></span>Enviar pelo WhatsApp</button>
        </form>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/store.js?v=2"></script>
<script src="assets/js/site.js?v=1"></script>
</body>
</html>
